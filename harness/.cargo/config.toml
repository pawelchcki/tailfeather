[build]
target = "x86_64-unknown-linux-none"

# The target defaults to a position-independent executable, which assumes
# something processes the relocations before `main` runs. With no libc there is
# no such startup code, so every absolute address — including string literals —
# is wrong and the program dies before its first instruction of real work.
# A fixed-address executable needs no relocation processing at all.
rustflags = ["-C", "relocation-model=static"]

# `x86_64-unknown-linux-none` is a tier 3 target, so no prebuilt `core` ships
# for it and it must be compiled from source. This is the only part of the
# project that needs nightly; the firmware stays on stable.
[unstable]
build-std          = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
