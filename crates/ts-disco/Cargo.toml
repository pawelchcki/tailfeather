[package]
name        = "ts-disco"
description = "Tailscale's disco path-discovery protocol: NaCl-boxed pings and pongs on the WireGuard socket"
readme      = "README.md"
keywords    = ["tailscale", "nat-traversal", "no-std", "embedded"]
categories  = ["network-programming", "no-std", "cryptography"]

edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[dependencies]
heapless.workspace = true
ts-keys.workspace  = true

# NaCl `crypto_box`: X25519 with HSalsa20 key derivation and XSalsa20-Poly1305.
# A different AEAD from everything else in this tree, because disco predates the
# rest of the protocol and kept NaCl's.
crypto_box = { version = "0.9", default-features = false, features = ["salsa20"] }
