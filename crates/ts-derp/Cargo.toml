[package]
name        = "ts-derp"
description = "DERP v2 client: relaying packets between Tailscale nodes with no direct path"
readme      = "README.md"
keywords    = ["tailscale", "derp", "relay", "no-std", "embedded"]
categories  = ["network-programming", "no-std"]

edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[dependencies]
heapless.workspace = true
ts-keys.workspace  = true

# The same NaCl box disco uses. DERP's handshake is sealed with the node key
# against the server's, so the two crates share a primitive but not a key.
crypto_box = { version = "0.9", default-features = false, features = ["salsa20"] }
