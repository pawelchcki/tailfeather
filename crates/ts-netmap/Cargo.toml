[package]
name        = "ts-netmap"
description = "Streaming parser for Tailscale MapResponse: peers, deltas and the DERP map, without an allocator"
readme      = "README.md"
keywords    = ["tailscale", "json", "no-std", "embedded", "streaming"]
categories  = ["network-programming", "no-std", "parser-implementations"]

edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
version.workspace      = true

[dependencies]
heapless.workspace = true
ts-keys.workspace  = true

[dev-dependencies]
# The capture is read with `std` in tests/; the crate itself needs neither.
serde_json = "1"
